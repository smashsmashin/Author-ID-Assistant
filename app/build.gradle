apply plugin: 'com.android.application'

android {
    namespace 'app.smashsmashin.authoridassistant'
    compileSdkVersion 34

    defaultConfig {
        applicationId "app.smashsmashin.authoridassistant"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        // No UI needed
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if(project.hasProperty("signing.properties")
        && new File(project.property("signing.properties")).exists()) {

        Properties props = new Properties()
        props.load(new FileInputStream(new File(project.property("signing.properties"))))

        signingConfigs {
            release {
                storeFile file(props['keystore'])
                keyAlias props['keyAlias']
                storePassword props['keystore.password']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if(project.hasProperty("signing.properties")
                && new File(project.property("signing.properties")).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'androidx.test:core:1.5.0'
}
